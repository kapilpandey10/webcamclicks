# Netlify configuration for WebcamClicks
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"
    X-Robots-Tag = "all"

# Long cache for static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Canonical 301 Redirects: www to non-www
[[redirects]]
  from = "https://www.webcamclicks.com/*"
  to = "https://webcamclicks.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.webcamclicks.com/*"
  to = "https://webcamclicks.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://webcamclicks.com/*"
  to = "https://webcamclicks.com/:splat"
  status = 301
  force = true
